      - name: 🔑 2. Thiet lap SSH & User CyberLexS_Vx
        run: |
          # 1. Tao user moi va thiet lap mat khau
          sudo useradd -m CyberLexS_Vx
          echo "CyberLexS_Vx:vps12345" | sudo chpasswd
          
          # 2. Cap quyen Admin (sudo) cho user moi
          sudo usermod -aG sudo CyberLexS_Vx
          
          # 3. Cho phep SSH bang mat khau (quan trong)
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/g' /etc/ssh/sshd_config
          sudo service ssh restart
          
          # 4. Lay IP va in thong tin
          IP_ADDR=$(tailscale ip -4)
          echo -e "\n\033[1;32m=========================================="
          echo -e "   INFO VPS CUA BAN (COPY VAO TERMIUS)"
          echo -e "=========================================="
          echo -e "📍 IP: $IP_ADDR"
          echo -e "👤 USER: CyberLexS_Vx"
          echo -e "🔑 PASS: vps12345"
          echo -e "🚪 PORT: 22"
          echo -e "==========================================\033[0m\n"
